[project]
name = "versed"
version = "0.1.0"
description = "Version-aware documentation QA over LangChain's docs"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "alembic>=1.13.3",
    "pydantic-settings>=2.5",
    "langchain-ollama>=0.2.0",
    "typer>=0.12.5",
    "tiktoken>=0.8.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff==0.6.9",
    "pre-commit>=3.8",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/versed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a running Postgres (docker compose up -d db)",
    "slow: hits the network (git clone, pip install, Ollama embeddings)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
